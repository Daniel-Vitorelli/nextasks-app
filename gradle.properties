kotlin.code.style=official

# `connectedDebugAndroidTest` desinstala os APKs ao terminar — e desinstalar apaga
# os dados do app no emulador (rotinas, tarefas, hábitos). Com esta flag o app fica
# instalado e o estado de teste sobrevive à rodada.
android.injected.androidTest.leaveApksInstalledAfterRun=true
